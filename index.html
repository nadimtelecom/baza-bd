<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার ই-কমার্স শপ</title>
    
    <!-- সিএসএস (CSS) স্টাইলগুলো এখানে রাখা হয়েছে -->
    <style>
        /* সাধারণ স্টাইল */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            color: #333;
        }

        /* হেডার স্টাইল */
        header {
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header .logo {
            font-size: 24px;
            font-weight: bold;
        }

        header nav ul {
            list-style: none;
            display: flex;
        }

        header nav ul li {
            margin-left: 20px;
        }

        header nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        header nav ul li a:hover {
            color: #e74c3c;
        }

        .cart {
            cursor: pointer;
            background: #e74c3c;
            padding: 8px 15px;
            border-radius: 5px;
        }

        /* ব্যানার স্টাইল */
        .banner {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://via.placeholder.com/1200x400') no-repeat center center/cover;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        .banner-content h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .banner-content p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #e74c3c;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        /* পণ্য সেকশন */
        .products-section {
            padding: 40px 20px;
            text-align: center;
        }

        .products-section h2 {
            margin-bottom: 30px;
            font-size: 28px;
            color: #2c3e50;
        }

        .product-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .product-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 250px;
            text-align: center;
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .product-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .product-card .price {
            color: #e74c3c;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .product-card button {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .product-card button:hover {
            background-color: #34495e;
        }

        /* ফুটার স্টাইল */
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- হেডার বা ন্যাভিগেশন বার -->
    <header>
        <div class="logo">ই-শপ</div>
        <nav>
            <ul>
                <li><a href="#">হোম</a></li>
                <li><a href="#products">পণ্যসমূহ</a></li>
                <li><a href="#about">আমাদের সম্পর্কে</a></li>
                <li><a href="#contact">যোগাযোগ</a></li>
            </ul>
        </nav>
        <div class="cart">
            🛒 কার্ট (<span id="cart-count">0</span>)
        </div>
    </header>

    <!-- ব্যানার সেকশন -->
    <section class="banner">
        <div class="banner-content">
            <h1>সেরা অফারে অনলাইন শপিং করুন</h1>
            <p>আপনার পছন্দের পণ্যটি লুফে নিন আজই!</p>
            <a href="#products" class="btn">কেনাকাটা শুরু করুন</a>
        </div>
    </section>

    <!-- পণ্যের তালিকা -->
    <section id="products" class="products-section">
        <h2>আমাদের জনপ্রিয় পণ্যসমূহ</h2>
        <div class="product-grid">
            <!-- পণ্য ১ -->
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="পণ্য ১">
                <h3>স্টাইলিশ টি-শার্ট</h3>
                <p class="price">৫০০ টাকা</p>
                <button onclick="addToCart()">কার্টে যোগ করুন</button>
            </div>
            <!-- পণ্য ২ -->
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="পণ্য ২">
                <h3>ক্যাজুয়াল জুতো</h3>
                <p class="price">১,৫০০ টাকা</p>
                <button onclick="addToCart()">কার্টে যোগ করুন</button>
            </div>
            <!-- পণ্য ৩ -->
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="পণ্য ৩">
                <h3>স্মার্ট ওয়াচ</h3>
                <p class="price">২,৫০০ টাকা</p>
                <button onclick="addToCart()">কার্টে যোগ করুন</button>
            </div>
        </div>
    </section>

    <!-- ফুটার -->
    <footer>
        <p>&copy; ২০২৬ ই-শপ। সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

    <!-- জাভাস্ক্রিপ্ট -->
    <script>
        let count = 0;
        function addToCart() {
            count++;
            document.getElementById('cart-count').innerText = count;
            alert('পণ্যটি কার্টে যোগ করা হয়েছে!');
        }
    </script>

</body>
</html>

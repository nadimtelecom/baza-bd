<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার ই-কমার্স শপ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- হেডার বা ন্যাভিগেশন বার -->
    <header>
        <div class="logo">ই-শপ</div>
        <nav>
            <ul>
                <li><a href="#">হোম</a></li>
                <li><a href="#products">পণ্যসমূহ</a></li>
                <li><a href="#about">আমাদের সম্পর্কে</a></li>
                <li><a href="#contact">যোগাযোগ</a></li>
            </ul>
        </nav>
        <div class="cart">
            🛒 কার্ট (<span id="cart-count">0</span>)
        </div>
    </header>

    <!-- ব্যানার সেクション -->
    <section class="banner">
        <div class="banner-content">
            <h1>সেরা অফারে অনলাইন শপিং করুন</h1>
            <p>আপনার পছন্দের পণ্যটি লুফে নিন আজই!</p>
            <a href="#products" class="btn">কেনাকাটা শুরু করুন</a>
        </div>
    </section>

    <!-- পণ্যের তালিকা -->
    <section id="products" class="products-section">
        <h2>আমাদের জনপ্রিয় পণ্যসমূহ</h2>
        <div class="product-grid">
            <!-- পণ্য ১ -->
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="পণ্য ১">
                <h3>স্টাইলিশ টি-শার্ট</h3>
                <p class="price">৫০০ টাকা</p>
                <button onclick="addToCart()">কার্টে যোগ করুন</button>
            </div>
            <!-- পণ্য ২ -->
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="পণ্য ২">
                <h3>ক্যাজুয়াল জুতো</h3>
                <p class="price">১,৫০০ টাকা</p>
                <button onclick="addToCart()">কার্টে যোগ করুন</button>
            </div>
            <!-- পণ্য ৩ -->
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="পণ্য ৩">
                <h3>স্মার্ট ওয়াচ</h3>
                <p class="price">২,৫০০ টাকা</p>
                <button onclick="addToCart()">কার্টে যোগ করুন</button>
            </div>
        </div>
    </section>

    <!-- ফুটার -->
    <footer>
        <p>&copy; ২০২৬ ই-শপ। সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

    <script>
        let count = 0;
        function addToCart() {
            count++;
            document.getElementById('cart-count').innerText = count;
            alert('পণ্যটি কার্টে যোগ করা হয়েছে!');
        }
    </script>

</body>
</html>
